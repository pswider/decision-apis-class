<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 372" width="1200" height="372" role="img" aria-labelledby="t d">
  <title id="t">The record in eight numbers</title>
  <desc id="d">Measured on public platforms on November 12, 2026: 31 conference events since 2017, in 10 countries; 149 community meetups held; 1,067 community members; 45 analyst articles. Published by third parties: Most Active Speaker three years running, 2023 to 2025; three book editions as co-author. Stated by his company: 15 hospitals running his platform, for more than 15 years.</desc>
