<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
  <title id="t">Signature claims</title>
  <desc id="d">Four signature claims. One: putting AI directly in patients' hands since 2001, with a handheld screening engine that ran for more than a decade. Stated. Two: one of the earliest voices on generative AI and the patient experience, speaking publicly since May 2023. Published. Three: creator of Tula, one of the first open-source, patient-owned health agents. Measured. Four: a leading voice on patient-first AI governance, in 2026. Published.</desc>
  <rect width="1200" height="440" rx="24" fill="#FAF8F3"/>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="24" fill="none" stroke="#E1DBC6"/>
  <g font-family="'Segoe Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
    <!-- 1: the one that matters -->
    <g>
      <rect x="30" y="28" width="555" height="186" rx="16" fill="#F7ECD9" stroke="#A76F3E" stroke-width="1.5"/>
      <circle cx="70" cy="68" r="16" fill="#A76F3E"/><text x="70" y="73.5" text-anchor="middle" font-size="15" font-weight="600" fill="#FEF9ED">1</text>
      <circle cx="106" cy="68" r="5" fill="#3D7FC4"/><text x="119" y="73" font-size="13" font-weight="600" letter-spacing="2" fill="#4A413B">STATED</text>
      <text x="58" y="134" font-size="44" font-weight="600" fill="#A76F3E">2001</text>
      <text x="182" y="134" font-family="'Segoe Serif',Georgia,'Times New Roman',serif" font-size="27" fill="#191919">AI in patients' hands</text>
      <text x="58" y="170" font-size="15" fill="#4A413B">A handheld pre-anesthesia screening engine, given directly to</text>
      <text x="58" y="191" font-size="15" fill="#4A413B">patients. It ran for more than a decade.</text>
    </g>
    <!-- 2 -->
    <g>
      <rect x="615" y="28" width="555" height="186" rx="16" fill="#FFFFFF" stroke="#E1DBC6"/>
      <circle cx="655" cy="68" r="16" fill="#A76F3E"/><text x="655" y="73.5" text-anchor="middle" font-size="15" font-weight="600" fill="#FEF9ED">2</text>
      <circle cx="691" cy="68" r="5" fill="#A76F3E"/><text x="704" y="73" font-size="13" font-weight="600" letter-spacing="2" fill="#4A413B">PUBLISHED</text>
      <text x="643" y="134" font-size="44" font-weight="600" fill="#A76F3E">2023</text>
      <text x="767" y="134" font-family="'Segoe Serif',Georgia,'Times New Roman',serif" font-size="27" fill="#191919">Generative AI for patients</text>
      <text x="643" y="170" font-size="15" fill="#4A413B">One of the earliest voices on generative AI and the patient</text>
      <text x="643" y="191" font-size="15" fill="#4A413B">experience, speaking publicly since May 2023.</text>
    </g>
    <!-- 3 -->
    <g>
      <rect x="30" y="226" width="555" height="186" rx="16" fill="#FFFFFF" stroke="#E1DBC6"/>
      <circle cx="70" cy="266" r="16" fill="#A76F3E"/><text x="70" y="271.5" text-anchor="middle" font-size="15" font-weight="600" fill="#FEF9ED">3</text>
      <circle cx="106" cy="266" r="5" fill="#1B8A6B"/><text x="119" y="271" font-size="13" font-weight="600" letter-spacing="2" fill="#4A413B">MEASURED</text>
      <text x="58" y="332" font-size="44" font-weight="600" fill="#A76F3E">Tula</text>
      <text x="182" y="332" font-family="'Segoe Serif',Georgia,'Times New Roman',serif" font-size="27" fill="#191919">A patient-owned agent</text>
      <text x="58" y="368" font-size="15" fill="#4A413B">Creator of one of the first open-source, patient-owned health</text>
      <text x="58" y="389" font-size="15" fill="#4A413B">agents, and its principal committer.</text>
    </g>
    <!-- 4 -->
    <g>
      <rect x="615" y="226" width="555" height="186" rx="16" fill="#FFFFFF" stroke="#E1DBC6"/>
      <circle cx="655" cy="266" r="16" fill="#A76F3E"/><text x="655" y="271.5" text-anchor="middle" font-size="15" font-weight="600" fill="#FEF9ED">4</text>
      <circle cx="691" cy="266" r="5" fill="#A76F3E"/><text x="704" y="271" font-size="13" font-weight="600" letter-spacing="2" fill="#4A413B">PUBLISHED</text>
      <text x="643" y="332" font-size="44" font-weight="600" fill="#A76F3E">2026</text>
      <text x="767" y="332" font-family="'Segoe Serif',Georgia,'Times New Roman',serif" font-size="27" fill="#191919">Patient-first governance</text>
      <text x="643" y="368" font-size="15" fill="#4A413B">A leading voice on AI governance that follows the patient's</text>
      <text x="643" y="389" font-size="15" fill="#4A413B">own agent, not the hospital's walls.</text>
    </g>
  </g>
</svg>
