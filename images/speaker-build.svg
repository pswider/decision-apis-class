<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 372" width="1200" height="372" role="img" aria-labelledby="t d">
  <title id="t">The system behind this class, in eight numbers</title>
  <desc id="d">Counted from the project's repository and run logs on November 12, 2026. 237 commits since May 26, 2026. 37,326 lines of TypeScript in 381 files. 859 automated tests. 15 database migrations. 7,472 lines of physician time scored by a decision model, for 484 physicians. 875 model calls in three runs for 3 cents. 248 extra calls to test robustness. 6 problems caught in dry runs before anything was sent.</desc>
  <rect width="1200" height="372" rx="24" fill="#FAF8F3"/>
  <rect x="0.5" y="0.5" width="1199" height="371" rx="24" fill="none" stroke="#E1DBC6"/>
  <g font-family="'Segoe Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
    <g>
      <rect x="30" y="28" width="270" height="148" rx="16" fill="#FFFFFF" stroke="#E1DBC6"/>
      <text x="54" y="64" font-size="15" fill="#5D524B">Commits</text>
      <text x="54" y="118" font-size="46" font-weight="600" fill="#191919">237</text>
      <text x="54" y="146" font-size="14" fill="#5D524B">Since May 26, 2026</text>
    </g>
    <g>
      <rect x="320" y="28" width="270" height="148" rx="16" fill="#FFFFFF" stroke="#E1DBC6"/>
      <text x="344" y="64" font-size="15" fill="#5D524B">Lines of TypeScript</text>
      <text x="344" y="118" font-size="46" font-weight="600" fill="#191919">37,326</text>
      <text x="344" y="146" font-size="14" fill="#5D524B">In 381 files</text>
    </g>
    <g>
      <rect x="610" y="28" width="270" height="148" rx="16" fill="#FFFFFF" stroke="#E1DBC6"/>
      <text x="634" y="64" font-size="15" fill="#5D524B">Automated tests</text>
      <text x="634" y="118" font-size="46" font-weight="600" fill="#191919">859</text>
      <text x="634" y="146" font-size="14" fill="#5D524B">All passing at the pinned commit</text>
    </g>
    <g>
      <rect x="900" y="28" width="270" height="148" rx="16" fill="#FFFFFF" stroke="#E1DBC6"/>
      <text x="924" y="64" font-size="15" fill="#5D524B">Database migrations</text>
      <text x="924" y="118" font-size="46" font-weight="600" fill="#191919">15</text>
      <text x="924" y="146" font-size="14" fill="#5D524B">Plus 40 deployment scripts</text>
    </g>
    <g>
      <rect x="30" y="196" width="270" height="148" rx="16" fill="#F7ECD9" stroke="#A76F3E" stroke-width="1.5"/>
      <text x="54" y="232" font-size="15" fill="#5D524B">Lines scored by the model</text>
      <text x="54" y="286" font-size="46" font-weight="600" fill="#191919">7,472</text>
      <text x="54" y="314" font-size="14" fill="#5D524B">One fiscal year, 484 physicians</text>
    </g>
    <g>
      <rect x="320" y="196" width="270" height="148" rx="16" fill="#FFFFFF" stroke="#E1DBC6"/>
      <text x="344" y="232" font-size="15" fill="#5D524B">Cost of scoring them</text>
      <text x="344" y="286" font-size="46" font-weight="600" fill="#191919">$0.03</text>
      <text x="344" y="314" font-size="14" fill="#5D524B">875 calls, none failed</text>
    </g>
    <g>
      <rect x="610" y="196" width="270" height="148" rx="16" fill="#FFFFFF" stroke="#E1DBC6"/>
      <text x="634" y="232" font-size="15" fill="#5D524B">Robustness test calls</text>
      <text x="634" y="286" font-size="46" font-weight="600" fill="#191919">248</text>
      <text x="634" y="314" font-size="14" fill="#5D524B">Reshuffling and injection</text>
    </g>
    <g>
      <rect x="900" y="196" width="270" height="148" rx="16" fill="#FFFFFF" stroke="#E1DBC6"/>
      <text x="924" y="232" font-size="15" fill="#5D524B">Problems caught in dry runs</text>
      <text x="924" y="286" font-size="46" font-weight="600" fill="#191919">6</text>
      <text x="924" y="314" font-size="14" fill="#5D524B">Before anything was sent</text>
    </g>
  </g>
</svg>
