<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">How the model read one fiscal year of claimed lines</title>
  <desc id="d">Administration, 5,628 lines: 2,892 confirmed (51 percent), 816 worth a look (15 percent), 1,486 unclear text (26 percent), 434 likely miscoded (8 percent). Teaching, 1,844 lines: 347 confirmed (19 percent), 459 worth a look (25 percent), 914 unclear text (50 percent), 124 likely miscoded (7 percent). These are model outputs that no person has reviewed.</desc>
  <rect width="1200" height="400" rx="24" fill="#FAF8F3"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="24" fill="none" stroke="#E1DBC6"/>

  <text x="48" y="62" font-family="'Segoe Serif',Georgia,'Times New Roman',serif" font-size="30" fill="#191919">How the model read 7,472 claimed lines</text>

  <g font-family="'Segoe Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
    <!-- legend, in block order -->
    <g font-size="16" fill="#4A413B">
      <rect x="250" y="92" width="16" height="16" rx="4" fill="#1B8A6B"/><text x="274" y="106">Confirmed</text>
      <rect x="390" y="92" width="16" height="16" rx="4" fill="#BF7F17"/><text x="414" y="106">Worth a look</text>
      <rect x="548" y="92" width="16" height="16" rx="4" fill="#3D7FC4"/><text x="572" y="106">Unclear text</text>
      <rect x="700" y="92" width="16" height="16" rx="4" fill="#B8432F"/><text x="724" y="106">Likely miscoded</text>
    </g>

    <!-- Administration -->
    <text x="48" y="164" font-size="18" font-weight="600" fill="#191919">Administration</text>
    <text x="48" y="186" font-size="15" fill="#5D524B">5,628 lines</text>
    <rect x="250" y="150" width="459.4" height="28" rx="4" fill="#1B8A6B"/>
    <rect x="711.4" y="150" width="129.6" height="28" rx="4" fill="#BF7F17"/>
    <rect x="843" y="150" width="236" height="28" rx="4" fill="#3D7FC4"/>
    <rect x="1081" y="150" width="68.9" height="28" rx="4" fill="#B8432F"/>
    <g font-size="15" font-weight="600">
      <text x="260" y="169" fill="#FFFFFF">2,892</text>
      <text x="721.4" y="169" fill="#191919">816</text>
      <text x="853" y="169" fill="#FFFFFF">1,486</text>
      <text x="1091" y="169" fill="#FFFFFF">434</text>
    </g>
    <g font-size="14" fill="#5D524B">
      <text x="260" y="198">51%</text>
      <text x="721.4" y="198">15%</text>
      <text x="853" y="198">26%</text>
      <text x="1091" y="198">8%</text>
    </g>

    <!-- Teaching -->
    <text x="48" y="256" font-size="18" font-weight="600" fill="#191919">Teaching</text>
    <text x="48" y="278" font-size="15" fill="#5D524B">1,844 lines</text>
    <rect x="250" y="242" width="168.2" height="28" rx="4" fill="#1B8A6B"/>
    <rect x="420.2" y="242" width="222.5" height="28" rx="4" fill="#BF7F17"/>
    <rect x="644.7" y="242" width="443.1" height="28" rx="4" fill="#3D7FC4"/>
    <rect x="1089.8" y="242" width="60.1" height="28" rx="4" fill="#B8432F"/>
    <g font-size="15" font-weight="600">
      <text x="260" y="261" fill="#FFFFFF">347</text>
      <text x="430.2" y="261" fill="#191919">459</text>
      <text x="654.7" y="261" fill="#FFFFFF">914</text>
      <text x="1099.8" y="261" fill="#FFFFFF">124</text>
    </g>
    <g font-size="14" fill="#5D524B">
      <text x="260" y="290">19%</text>
      <text x="430.2" y="290">25%</text>
      <text x="654.7" y="290">50%</text>
      <text x="1099.8" y="290">7%</text>
    </g>

    <line x1="48" y1="322" x2="1152" y2="322" stroke="#E1DBC6"/>
    <text x="48" y="354" font-size="15" fill="#5D524B">Each bar is the whole of its group. Model output on short text, scored by jev-1.14.0. No person has reviewed these yet.</text>
  </g>
</svg>
