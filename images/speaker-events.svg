  <text x="48" y="92" font-family="'Segoe Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#5D524B">Conference events on his Sessionize record, by year. Counted November 12, 2026. The record ends in July 2025.</text>

