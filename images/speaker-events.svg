<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">Conference events per year, 2017 to 2025</title>
  <desc id="d">Events on his Sessionize record by year. 2017: 1. 2018: 1. 2019: 2. 2020: 4. 2021: 3. 2022: 3. 2023: 4. 2024: 9. 2025: 4, through July. Total 31.</desc>
