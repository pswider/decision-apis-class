<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">How a line travels from the database to a score</title>
  <desc id="d">A line is read from a de-identified database and turned into a case. Two text fields pass through redaction, the only way out. They are posted with three typed questions to the decision API. The probabilities that come back are turned into a certainty score, a band and a direction, shown in a review queue sorted lowest certainty first. A person records a verdict, which measures how well the score is calibrated. Circled numbers match the six code links.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5D524B"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A76F3E"/></marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#FAF8F3"/>
  <rect x="0.5" y="0.5" width="1199" height="559" rx="24" fill="none" stroke="#E1DBC6"/>

  <text x="48" y="62" font-family="'Segoe Serif',Georgia,'Times New Roman',serif" font-size="30" fill="#191919">From a database row to a score</text>
  <text x="48" y="92" font-family="'Segoe Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#5D524B">The circled numbers are the six code links in the tour.</text>

  <!-- boundary: what stays on the machine -->
  <rect x="40" y="118" width="720" height="402" rx="18" fill="none" stroke="#96826F" stroke-dasharray="2 6" stroke-linecap="round"/>
  <text x="62" y="506" font-family="'Segoe Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="2" fill="#5D524B">ON YOUR MACHINE</text>

  <g font-family="'Segoe Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
    <!-- row 1 -->
    <rect x="72" y="150" width="300" height="130" rx="16" fill="#FFFFFF" stroke="#E1DBC6"/>
    <text x="96" y="190" font-size="20" font-weight="600" fill="#191919">De-identified database</text>
    <text x="96" y="218" font-size="15" fill="#4A413B">One line of physician time:</text>
    <text x="96" y="240" font-size="15" fill="#4A413B">role text, code, effort, name, id</text>
    <text x="96" y="262" font-size="15" fill="#4A413B">becomes a case</text>

    <rect x="428" y="150" width="300" height="130" rx="16" fill="#F7ECD9" stroke="#A76F3E" stroke-width="1.5"/>
    <text x="452" y="190" font-size="20" font-weight="600" fill="#191919">Redaction</text>
    <text x="452" y="218" font-size="15" fill="#4A413B">The only way out: an allowlist</text>
    <text x="452" y="240" font-size="15" fill="#4A413B">of two text fields, then a scrub</text>
    <text x="452" y="262" font-size="15" fill="#4A413B">of names, ids and every number</text>

    <rect x="828" y="150" width="332" height="130" rx="16" fill="#191919"/>
    <text x="852" y="190" font-size="20" font-weight="600" fill="#FEF9ED">Decision API</text>
    <text x="852" y="218" font-family="ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace" font-size="15" fill="#F7ECD9">POST /v1/systemone</text>
    <text x="852" y="240" font-size="15" fill="#E1DBC6">state + three typed questions</text>
    <text x="852" y="262" font-size="15" fill="#E1DBC6">about 850 input tokens, 64 ms</text>

    <!-- row 2 -->
    <rect x="428" y="340" width="300" height="130" rx="16" fill="#FFFFFF" stroke="#E1DBC6"/>
    <text x="452" y="380" font-size="20" font-weight="600" fill="#191919">Score</text>
    <text x="452" y="408" font-size="15" fill="#4A413B">Add the probabilities by class.</text>
    <text x="452" y="430" font-size="15" fill="#4A413B">Code certainty, a band,</text>
    <text x="452" y="452" font-size="15" fill="#4A413B">and a direction</text>

    <rect x="72" y="340" width="300" height="130" rx="16" fill="#FFFFFF" stroke="#E1DBC6"/>
    <text x="96" y="380" font-size="20" font-weight="600" fill="#191919">Review queue</text>
    <text x="96" y="408" font-size="15" fill="#4A413B">Lowest certainty first.</text>
    <text x="96" y="430" font-size="15" fill="#4A413B">A person reads the line and</text>
    <text x="96" y="452" font-size="15" fill="#4A413B">records a verdict</text>

    <!-- arrows -->
    <path d="M376 215 H420" stroke="#5D524B" stroke-width="2" marker-end="url(#a)"/>
    <path d="M732 215 H820" stroke="#5D524B" stroke-width="2" marker-end="url(#a)"/>
    <path d="M994 284 V405 H736" fill="none" stroke="#5D524B" stroke-width="2" marker-end="url(#a)"/>
    <path d="M424 405 H380" stroke="#5D524B" stroke-width="2" marker-end="url(#a)"/>
    <path d="M222 336 V288" stroke="#A76F3E" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#b)"/>

    <text x="776" y="203" font-size="14" fill="#5D524B" text-anchor="middle">2 fields</text>
    <text x="1010" y="350" font-size="14" fill="#5D524B">probabilities for</text>
    <text x="1010" y="370" font-size="14" fill="#5D524B">every option</text>
    <text x="236" y="318" font-size="14" fill="#A76F3E">verdicts measure calibration</text>

    <!-- pipeline note -->
    <rect x="828" y="424" width="332" height="96" rx="16" fill="#F4F1EA" stroke="#E1DBC6"/>
    <text x="852" y="458" font-size="16" font-weight="600" fill="#191919">Pipeline around the call</text>
    <text x="852" y="482" font-size="15" fill="#4A413B">Identical text is asked once and</text>
    <text x="852" y="503" font-size="15" fill="#4A413B">cached: 7,472 lines, 917 questions</text>

    <!-- numbered badges -->
    <g font-size="15" font-weight="700" fill="#FEF9ED" text-anchor="middle">
      <circle cx="356" cy="166" r="14" fill="#A76F3E"/><text x="356" y="171">6</text>
      <circle cx="712" cy="166" r="14" fill="#A76F3E"/><text x="712" y="171">5</text>
      <circle cx="1144" cy="166" r="14" fill="#A76F3E"/><text x="1144" y="171">1</text>
      <circle cx="1110" cy="166" r="14" fill="#A76F3E"/><text x="1110" y="171">2</text>
      <circle cx="712" cy="356" r="14" fill="#A76F3E"/><text x="712" y="361">3</text>
      <circle cx="1144" cy="440" r="14" fill="#A76F3E"/><text x="1144" y="445">4</text>
    </g>
  </g>
</svg>
